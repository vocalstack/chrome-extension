<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VocalStack · Microphone</title>
    <style>
      :root{color-scheme:dark}
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#131326;color:#eaecfa;font:400 15px/1.5 Inter,system-ui,sans-serif}
      main{max-width:420px;padding:32px;text-align:center}
      img{width:52px;height:44px}
      h1{font-size:22px;font-weight:600;letter-spacing:-.4px;margin:18px 0 8px}
      p{color:rgba(234,236,250,.62);margin:0 0 8px}
      .ok{color:#34d399}.bad{color:#e8695e}
      @media (prefers-color-scheme:light){:root{color-scheme:light}body{background:#f6f7fb;color:#0a0c29}p{color:rgba(10,12,41,.62)}}
    </style>
  </head>
  <body>
    <main>
      <img src="/icon/128.png" alt="" />
      <h1>Allow the microphone</h1>
      <p id="msg">Chrome is asking whether VocalStack may use your microphone. It is used only while you record, and you can stop at any time.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
