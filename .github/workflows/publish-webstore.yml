# Publishes the extension to the Chrome Web Store. Every release does it:
# build.yml calls this once a version tag's build and release succeed, and
# publishes to everyone. It can also run by hand (Actions → publish-webstore
# → Run workflow), for trusted testers or a draft. Setup: PUBLISHING.md.
#
# The PUBLISH_EXTENSION repo variable set to "false"
# (`gh variable set PUBLISH_EXTENSION --body false`) pauses publishing with
# no code change.
name: publish-webstore

on:
  workflow_dispatch:
    inputs:
      target:
        description: Audience
        type: choice
        options: [default, trustedTesters]
        default: trustedTesters
      publish:
        description: Publish after the upload (off uploads a draft only)
        type: boolean
        default: false
  workflow_call:
    inputs:
      target:
        type: string
        default: default
      publish:
        type: boolean
        default: true
    secrets:
      CHROME_EXTENSION_ID:
      CHROME_PUBLISHER_ID:
      CHROME_CLIENT_ID:
      CHROME_CLIENT_SECRET:
      CHROME_REFRESH_TOKEN:

# Never two uploads to the same store item at once.
concurrency:
  group: publish-webstore
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: build, upload, publish
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          WEBSTORE_TARGET: ${{ inputs.target }}
          WEBSTORE_PUBLISH: ${{ inputs.publish }}
          PUBLISH_EXTENSION: ${{ vars.PUBLISH_EXTENSION }}
          # A release expects the store to get it: missing credentials fail.
          WEBSTORE_REQUIRED: ${{ github.event_name != 'workflow_dispatch' }}
        run: npm run publish:webstore

      - uses: actions/upload-artifact@v7
        with:
          name: vocalstack-webstore
          path: output/vocalstack-webstore.zip
          if-no-files-found: error
