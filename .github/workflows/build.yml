# Every push and pull request: typecheck, unit tests, and the builds you load
# unpacked (Chrome and Edge), kept as run artifacts.
#
# On main it also refreshes the `unpacked` release: every main build, for
# trying a change before it is released.
#
# A version tag (`git tag 0.1.25 && git push origin 0.1.25`, the manifest
# version of that commit: scripts/package.sh) releases it: a release of its
# own, which GitHub marks Latest, and the `latest` release moved to it,
# whose zips have links that never change (vocalstack.com/downloads/
# redirects to them):
#   https://github.com/vocalstack/chrome-extension/releases/download/latest/vocalstack-chrome.zip
#   https://github.com/vocalstack/chrome-extension/releases/download/latest/vocalstack-edge.zip
# Unzip, then chrome://extensions (edge://extensions) → Developer mode →
# Load unpacked → the unzipped folder. Then the webstore and edge jobs
# publish the version to the Chrome Web Store (publish-webstore.yml) and
# Edge Add-ons (publish-edge.yml).
name: build

on:
  push:
    branches: [main]
    tags: ['*', '!latest', '!unpacked'] # those two are moved by the runs below
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The version's last part counts the commits (scripts/package.sh).
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: build and zip (Chrome, Edge)
        run: scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: vocalstack-chrome
          path: output/chrome
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: vocalstack-edge
          path: output/edge
          if-no-files-found: error

      - name: refresh the unpacked release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./output/chrome/manifest.json').version")
          notes="Built from ${GITHUB_SHA::12}, version $version. Unzip, then chrome://extensions (or edge://extensions) → Developer mode → Load unpacked → the unzipped folder."
          # GitHub's release API answers a 5xx now and then (a 502 on an
          # asset upload, 2026-10-20): try each call a few times.
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 10)); done; "$@"; }
          if gh release view unpacked >/dev/null 2>&1; then
            # Move the tag, then swap the zips in place: the links stay the same.
            retry gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/unpacked" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            retry gh release upload unpacked output/vocalstack-chrome.zip --clobber
            retry gh release upload unpacked output/vocalstack-edge.zip --clobber
            retry gh release edit unpacked --title "Unpacked build $version" --notes "$notes"
          else
            gh release create unpacked output/vocalstack-chrome.zip output/vocalstack-edge.zip \
              --target "$GITHUB_SHA" --prerelease --title "Unpacked build $version" --notes "$notes"
          fi

      - name: release the version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version=$(node -p "require('./output/chrome/manifest.json').version")
          [ "$tag" = "$version" ] || { echo "::error::tag $tag does not match the build's version $version (scripts/package.sh: <package.json major.minor>.<commits>)"; exit 1; }
          gh release create "$tag" output/vocalstack-chrome.zip output/vocalstack-edge.zip \
            --verify-tag --latest --title "VocalStack for Chrome and Edge $tag" --generate-notes

      # The `latest` release follows each version, so its links never change.
      - name: refresh the latest release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="VocalStack for Chrome and Edge $tag (built from ${GITHUB_SHA::12}). Moves to each new version. Unzip, then chrome://extensions (or edge://extensions) → Developer mode → Load unpacked → the unzipped folder."
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 10)); done; "$@"; }
          if gh release view latest >/dev/null 2>&1; then
            retry gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            retry gh release upload latest output/vocalstack-chrome.zip output/vocalstack-edge.zip --clobber
            retry gh release edit latest --title "VocalStack for Chrome and Edge $tag (latest)" --notes "$notes" --latest=false
          else
            gh release create latest output/vocalstack-chrome.zip output/vocalstack-edge.zip \
              --target "$GITHUB_SHA" --latest=false --title "VocalStack for Chrome and Edge $tag (latest)" --notes "$notes"
          fi

  # A released version goes to the Chrome Web Store, for everyone.
  webstore:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish-webstore.yml
    with:
      target: default
      publish: true
    secrets: inherit

  # And to Edge Add-ons.
  edge:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish-edge.yml
    with:
      publish: true
    secrets: inherit
